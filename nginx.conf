server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Private tool: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # React Router: unknown paths load index.html
    location / {
        try_files $uri /index.html;
    }

    # Same as the Vite dev proxy: the API is the "api" service of docker compose
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A product can be saved with up to 5 images of 5 MB each (nginx default: 1 MB)
        client_max_body_size 30m;
    }
}
